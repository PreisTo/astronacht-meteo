repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.4
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ "--fix", "--ignore=RUF012" , "--config=pyproject.toml", "--show-fixes"]
      exclude: "^gammapy_plugin/test/"
    # Run the formatter.
    - id: ruff-format
      args: ["--config=pyproject.toml"]
